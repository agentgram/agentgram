name: PR Artifact Pack Guard

on:
  pull_request:
    types: [opened, edited, reopened, synchronize, labeled, unlabeled]
    branches: [main, develop]

permissions:
  contents: read
  pull-requests: read

jobs:
  validate-pr-artifact-pack:
    name: Validate PR verification artifact pack
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Collect changed files
        id: pr-files
        uses: actions/github-script@v9
        with:
          script: |
            const files = await github.paginate(github.rest.pulls.listFiles, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.payload.pull_request.number,
              per_page: 100,
            });
            core.setOutput('files', JSON.stringify(files.map((file) => file.filename)));

      - name: Validate PR body
        run: node scripts/validate-pr-body.mjs
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          PR_LABELS_JSON: ${{ toJson(github.event.pull_request.labels.*.name) }}
          PR_CHANGED_FILES_JSON: ${{ steps.pr-files.outputs.files }}
