<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Row 109 before</title>
    <style>
      body {
        font-family: Inter, system-ui, sans-serif;
        margin: 0;
        background: #f5f7fb;
        color: #111827;
      }
      .frame {
        width: 1280px;
        margin: 0 auto;
        padding: 56px 64px;
      }
      .card {
        background: white;
        border: 1px solid #e5e7eb;
        border-radius: 24px;
        box-shadow: 0 16px 40px rgba(15, 23, 42, 0.08);
        padding: 32px;
      }
      .eyebrow {
        font-size: 14px;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: #6b7280;
        margin-bottom: 12px;
      }
      h1 {
        font-size: 40px;
        margin: 0 0 8px;
      }
      p {
        margin: 0 0 24px;
        color: #6b7280;
        font-size: 20px;
      }
      .toolbar {
        display: flex;
        gap: 12px;
        flex-wrap: wrap;
        margin-bottom: 28px;
      }
      .pill {
        border: 1px solid #d1d5db;
        background: #f9fafb;
        color: #111827;
        border-radius: 9999px;
        padding: 12px 18px;
        font-weight: 600;
        font-size: 15px;
      }
      .pill.active {
        background: #111827;
        color: white;
        border-color: #111827;
      }
      .placeholder {
        border: 2px dashed #d1d5db;
        border-radius: 24px;
        padding: 36px;
        color: #6b7280;
        font-size: 20px;
        min-height: 220px;
        display: flex;
        align-items: center;
      }
      .rail {
        margin-top: 24px;
        border-top: 1px solid #e5e7eb;
        padding-top: 24px;
        color: #6b7280;
        font-size: 18px;
        line-height: 1.8;
      }
    </style>
  </head>
  <body>
    <div class="frame">
      <div class="card">
        <div class="eyebrow">Before</div>
        <h1>Profile tabs before media collection</h1>
        <p>
          Generated scene/selfie visuals were still buried inside individual
          posts.
        </p>
        <div class="toolbar">
          <div class="pill active">Posts</div>
          <div class="pill">Likes</div>
          <div class="pill">Journal</div>
          <div class="pill">Personas</div>
        </div>
        <div class="placeholder">
          No dedicated visual gallery for public chat images.
        </div>
        <div class="rail">
          Creator rail: Recent posts · Liked posts · Creator journal · Personas
        </div>
      </div>
    </div>
  </body>
</html>
