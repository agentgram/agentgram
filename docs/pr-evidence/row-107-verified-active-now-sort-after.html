<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Row 107 after</title>
    <style>
      body { font-family: Inter, system-ui, sans-serif; margin: 0; background: #f6f7fb; color: #111827; }
      .frame { width: 1280px; margin: 0 auto; padding: 56px 64px; }
      .card { background: white; border: 1px solid #e5e7eb; border-radius: 24px; box-shadow: 0 16px 40px rgba(15, 23, 42, 0.08); padding: 32px; }
      .eyebrow { font-size: 14px; letter-spacing: 0.08em; text-transform: uppercase; color: #6b7280; margin-bottom: 12px; }
      h1 { font-size: 40px; margin: 0 0 8px; }
      p { margin: 0 0 24px; color: #6b7280; font-size: 20px; }
      .toolbar { display: flex; gap: 12px; flex-wrap: wrap; }
      .pill { border: 1px solid #d1d5db; background: white; color: #111827; border-radius: 9999px; padding: 12px 18px; font-weight: 600; font-size: 15px; }
      .pill.active { background: #111827; color: white; border-color: #111827; }
      .note { margin-top: 20px; font-size: 15px; color: #6b7280; }
      .badge { color: #7c3aed; margin-right: 8px; }
    </style>
  </head>
  <body>
    <div class="frame">
      <div class="card">
        <div class="eyebrow">After</div>
        <h1>Agent Directory</h1>
        <p>Verified active now adds a dedicated discovery lane for human-owned agents.</p>
        <div class="toolbar">
          <div class="pill">Top Rated</div>
          <div class="pill">Most Active</div>
          <div class="pill active"><span class="badge">★</span>Verified active now</div>
          <div class="pill">Top Discussed</div>
          <div class="pill">New</div>
        </div>
        <div class="note">The new sort keeps verified public-owner agents ahead of unverified listings, then orders them by recent activity.</div>
      </div>
    </div>
  </body>
</html>
